<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French 5-Week Program — Post-202</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Français">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#1f2430; --sub:#5b6270;
    --accent:#1e3a5f; --accent2:#b23a2e; --line:#e4ddd0; --good:#2f7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia, 'Times New Roman', serif; background:var(--bg); color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--accent); color:#fff; padding:24px 32px 16px;
  }
  header h1{margin:0 0 4px; font-size:1.5rem; font-weight:600;}
  header p{margin:0; color:#cdd8e6; font-family:Helvetica,Arial,sans-serif; font-size:.9rem;}
  .authbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:10px 32px; background:#16283f; font-family:Helvetica,Arial,sans-serif; font-size:.85rem; color:#cdd8e6;
  }
  .authbar button{
    background:#fff; color:var(--accent); border:none; padding:7px 14px; border-radius:16px;
    font-size:.82rem; cursor:pointer; font-weight:600;
  }
  .authbar button.secondary{background:transparent; color:#cdd8e6; border:1px solid #3c526e;}
  nav{
    display:flex; flex-wrap:wrap; gap:6px; padding:14px 32px; background:#fff;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; font-family:Helvetica,Arial,sans-serif;
  }
  nav button.tab{
    border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 16px;
    border-radius:20px; cursor:pointer; font-size:.85rem; transition:.15s;
  }
  nav button.tab:hover{background:#f1ede4;}
  nav button.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  main{max-width:880px; margin:0 auto; padding:28px 32px 80px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .overview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; font-family:Helvetica,Arial,sans-serif;}
  @media (max-width:600px){ .overview-grid{grid-template-columns:1fr;} header,.authbar,nav,main{padding-left:16px; padding-right:16px;} }
  .overview-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .overview-card h3{margin:0 0 6px; font-size:.95rem; color:var(--accent);}
  .progress-bar{height:8px; border-radius:5px; overflow:hidden; background:#efe9dd; margin-top:8px;}
  .progress-fill{height:100%; background:var(--good); width:0%; transition:width .3s;}
  .week-header{margin-bottom:6px;}
  .week-header h2{margin:0; font-size:1.4rem; color:var(--accent);}
  .week-header .theme{font-family:Helvetica,Arial,sans-serif; color:var(--sub); font-size:.95rem; margin-top:2px;}
  .week-progress{font-family:Helvetica,Arial,sans-serif; font-size:.82rem; color:var(--sub); margin:10px 0 20px;}
  section.block{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 20px; margin-bottom:14px;
  }
  section.block h3{
    margin:0 0 10px; font-size:1.02rem; color:var(--accent2); font-family:Helvetica,Arial,sans-serif;
    display:flex; align-items:center; gap:8px;
  }
  section.block .badge{
    font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; background:#f1ede4;
    color:var(--sub); padding:2px 8px; border-radius:10px; font-weight:600;
  }
  ul.tasklist{list-style:none; margin:0; padding:0;}
  ul.tasklist li{
    display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:.94rem; line-height:1.45;
    font-family:Helvetica,Arial,sans-serif;
  }
  ul.tasklist li input{margin-top:3px; width:16px; height:16px; flex-shrink:0; cursor:pointer;}
  ul.tasklist li.checked label{color:var(--sub); text-decoration:line-through;}
  ul.tasklist a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent);}
  ul.tasklist a:hover{color:var(--accent2);}
  .resources ul{padding-left:18px;}
  .resources li{margin-bottom:6px; font-family:Helvetica,Arial,sans-serif; font-size:.92rem;}
  .reset-btn{
    font-family:Helvetica,Arial,sans-serif; font-size:.8rem; background:none; border:1px solid var(--line);
    color:var(--sub); padding:5px 12px; border-radius:14px; cursor:pointer; margin-top:24px;
  }
  .reset-btn:hover{border-color:var(--accent2); color:var(--accent2);}
  .setup-banner{
    font-family:Helvetica,Arial,sans-serif; font-size:.85rem; background:#fff3e0; border:1px solid #f0c98a;
    color:#7a5210; padding:12px 16px; border-radius:8px; margin-bottom:18px;
  }
</style>
</head>
<body>

<header>
  <h1>French Program — Post En Avant 202</h1>
  <p>5 weeks · ~8 hrs/week · Grammar · InnerFrench · Nouvelle Vague · Literature & Poetry</p>
</header>

<div class="authbar">
  <span id="authStatus">Checking sign-in…</span>
  <span>
    <button id="signInBtn" style="display:none;">Sign in with Google</button>
    <button id="signOutBtn" class="secondary" style="display:none;">Sign out</button>
  </span>
</div>

<nav id="nav"></nav>
<main id="main"></main>

<!-- Firebase (compat SDK, loaded from CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================================
   FIREBASE CONFIG — replace with your own project's values.
   Get these from: Firebase Console > Project settings > General >
   "Your apps" > Web app > SDK setup and configuration > Config.
   These values are safe to keep in client-side code — access is controlled
   by Firestore security rules, not by hiding this object.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDJmrtYM6dt-nP1PX5zCML0iIOVfjZMLpQ",
  authDomain: "frenchb2.firebaseapp.com",
  projectId: "frenchb2",
  storageBucket: "frenchb2.firebasestorage.app",
  messagingSenderId: "394840996420",
  appId: "1:394840996420:web:d1e8526c663791047b9a11",
  measurementId: "G-QQW3C57TEX"
};

let fbEnabled = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db, auth, currentUser = null, unsubscribeSnapshot = null;

if (fbEnabled) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>

<script>
const DATA = {
  weeks: [
    {
      title: "Week 1",
      theme: "Consolidation & Diagnostic",
      blocks: [
        { h: "Grammar", badge: "review", items: [
          "Review passé composé vs. imparfait vs. plus-que-parfait (Kwiziq or Lawless French)",
          "Review subjunctive triggers: emotion, doubt, necessity, wish"
        ]},
        { h: "Vocabulary", badge: "Anki", items: [
          "Build a 300-word Anki deck from your weakest En Avant ch. 13–16 material",
          "10 min/day review"
        ]},
        { h: "InnerFrench (podcast spine)", badge: "listening", items: [
          "Listen to an intro/culture episode — this podcast is your weekly listening core going forward",
          "Shadow (repeat aloud after) one 5-min segment daily",
          "<a href='https://innerfrench.com' target='_blank'>innerfrench.com — browse episode list</a>"
        ]},
        { h: "Nouvelle Vague film", badge: "cinema", items: [
          "Watch <em>Les Quatre Cents Coups</em> (Truffaut, 1959) — accessible dialogue, coming-of-age story",
          "<a href='https://en.wikipedia.org/wiki/The_400_Blows' target='_blank'>background reading (Wikipedia)</a>",
          "Note 10 new expressions from the dialogue"
        ]},
        { h: "Literature & Poetry", badge: "reading", items: [
          "Jacques Prévert, <em>Paroles</em> — read 'Déjeuner du matin' and 'Barbara' (short, conversational syntax — a gentle way into French poetry)",
          "Start a graded reader in parallel (e.g. <em>Le Petit Nicolas</em>)"
        ]},
        { h: "Speaking & Writing", badge: "output", items: [
          "Daily 5-sentence journal in French",
          "End-of-week: short self-assessment paragraph (this is your baseline for Week 5)"
        ]}
      ]
    },
    {
      title: "Week 2",
      theme: "Subjunctive, Conditional, Si-clauses",
      blocks: [
        { h: "Grammar", badge: "core", items: [
          "All three conditional / si-clause types",
          "Subjunctive after emotion, doubt, opinion",
          "Relative pronouns: dont, lequel, ce qui / ce que"
        ]},
        { h: "Vocabulary", badge: "Anki", items: [
          "200 words: opinion & debate vocabulary"
        ]},
        { h: "InnerFrench", badge: "listening", items: [
          "Listen to a société/opinion episode — connects to this week's grammar (expressing opinions)",
          "Shadow one segment daily"
        ]},
        { h: "Nouvelle Vague film", badge: "cinema", items: [
          "Watch <em>À bout de souffle</em> (Godard, 1960) — iconic jump cuts, colloquial register",
          "<a href='https://en.wikipedia.org/wiki/Breathless_(1960_film)' target='_blank'>background reading (Wikipedia)</a>",
          "Note how characters use informal register — ties into Week 4"
        ]},
        { h: "Literature & Poetry", badge: "reading", items: [
          "Albert Camus, <em>L'Étranger</em> — read the opening pages ('Aujourd'hui, maman est morte...') for tone and register",
          "Continue graded reader"
        ]},
        { h: "Speaking & Writing", badge: "output", items: [
          "Two 20-min iTalki or Tandem conversations",
          "Write two opinion paragraphs using subjunctive/conditional structures"
        ]}
      ]
    },
    {
      title: "Week 3",
      theme: "Narrative Writing & Complex Tenses",
      blocks: [
        { h: "Grammar", badge: "core", items: [
          "Plus-que-parfait and futur antérieur",
          "Passé simple — recognition only, for reading literary texts",
          "Gerund: en + present participle"
        ]},
        { h: "Vocabulary", badge: "Anki", items: [
          "Narrative connectors: d'abord, ensuite, par la suite, finalement"
        ]},
        { h: "InnerFrench", badge: "listening", items: [
          "Listen to a French history episode — matches this week's narrative/passé simple focus"
        ]},
        { h: "Nouvelle Vague film", badge: "cinema", items: [
          "Watch <em>Cléo de 5 à 7</em> (Varda, 1962) — real-time narrative structure, useful for discussing tense and sequencing",
          "<a href='https://en.wikipedia.org/wiki/Cl%C3%A9o_from_5_to_7' target='_blank'>background reading (Wikipedia)</a>"
        ]},
        { h: "Literature & Poetry", badge: "reading", items: [
          "Charles Baudelaire, <em>Les Fleurs du mal</em> — 'L'Albatros' and 'Correspondances'",
          "<a href='https://fr.wikisource.org/wiki/Les_Fleurs_du_mal' target='_blank'>full public-domain text on Wikisource</a>",
          "Guy de Maupassant, a short story (e.g. 'La Parure')"
        ]},
        { h: "Speaking & Writing", badge: "output", items: [
          "Two conversations focused on narrating past events",
          "Write a one-page past-tense narrative essay"
        ]}
      ]
    },
    {
      title: "Week 4",
      theme: "Register & Francophonie",
      blocks: [
        { h: "Grammar", badge: "core", items: [
          "Formal vs. informal register: tu/vous, subjunctive nuance",
          "Negation nuances: ne...que, ne...guère"
        ]},
        { h: "Vocabulary", badge: "Anki", items: [
          "Regional terms: Quebec, West Africa, Belgium"
        ]},
        { h: "InnerFrench", badge: "listening", items: [
          "Listen to an episode specifically about a francophone country outside France"
        ]},
        { h: "Nouvelle Vague film", badge: "cinema", items: [
          "Watch <em>Jules et Jim</em> (Truffaut, 1962) — complex relationships, register shifts in dialogue",
          "<a href='https://en.wikipedia.org/wiki/Jules_and_Jim' target='_blank'>background reading (Wikipedia)</a>"
        ]},
        { h: "Literature & Poetry", badge: "reading", items: [
          "Arthur Rimbaud, 'Le Dormeur du val' — pairs history/war themes with this week's cultural focus",
          "<a href='https://fr.wikisource.org/wiki/Le_Dormeur_du_val' target='_blank'>full public-domain text on Wikisource</a>",
          "Read one article comparing francophone regions (RFI or TV5Monde)"
        ]},
        { h: "Speaking & Writing", badge: "output", items: [
          "Two conversations on cultural topics — practice switching register mid-conversation",
          "Write a formal email and an informal text exchange side by side"
        ]}
      ]
    },
    {
      title: "Week 5",
      theme: "Integration & Capstone",
      blocks: [
        { h: "Grammar", badge: "review", items: [
          "Cumulative review quiz covering weeks 1–4"
        ]},
        { h: "Vocabulary", badge: "Anki", items: [
          "Full review of all decks — target 90% retention"
        ]},
        { h: "InnerFrench", badge: "listening", items: [
          "Listen to one full advanced episode, then self-quiz your comprehension without the transcript"
        ]},
        { h: "Nouvelle Vague film", badge: "cinema", items: [
          "Watch <em>Hiroshima mon amour</em> (Resnais, 1959) — capstone: non-linear narrative, memory, time — ties the course together",
          "<a href='https://en.wikipedia.org/wiki/Hiroshima_mon_amour' target='_blank'>background reading (Wikipedia)</a>"
        ]},
        { h: "Literature & Poetry", badge: "reading", items: [
          "Capstone recitation: choose your favorite poem from weeks 1–4 (Prévert, Baudelaire, or Rimbaud), memorize a stanza, and recite/analyze it aloud",
          "Finish your graded reader/short story collection and write a one-paragraph summary"
        ]},
        { h: "Speaking & Writing", badge: "output", items: [
          "30-min mock oral exam (record solo or with a partner): describe an experience, give an opinion, narrate a past event",
          "Capstone essay, 400–500 words, argumentative — self-edit with BonPatron",
          "Compare this week's output against your Week 1 diagnostic paragraph"
        ]}
      ]
    }
  ],
  resources: [
    ["Lawless French", "https://www.lawlessfrench.com", "Grammar reference & quizzes"],
    ["Kwiziq French", "https://kwiziq.com", "Adaptive grammar practice"],
    ["InnerFrench", "https://innerfrench.com", "Intermediate podcast — weekly listening spine"],
    ["News in Slow French", "https://www.newsinslowfrench.com", "Slowed news audio"],
    ["RFI — Journal en français facile", "https://francaisfacile.rfi.fr", "Simplified daily news"],
    ["TV5MONDE Langue Française", "https://langue-francaise.tv5monde.com", "Francophonie culture & video"],
    ["iTalki", "https://www.italki.com", "Paid conversation partners/tutors"],
    ["Tandem", "https://www.tandem.net", "Free language exchange"],
    ["BonPatron", "https://bonpatron.com", "French grammar/spell checker for writing"],
    ["Anki", "https://apps.ankiweb.net", "Spaced-repetition vocab"],
    ["Wikisource (français)", "https://fr.wikisource.org", "Public-domain texts — Baudelaire, Rimbaud, etc."]
  ]
};

const STORAGE_KEY = "frenchProgramProgress";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let activeTab = 0;

function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function saveRemote(){
  if (fbEnabled && currentUser && db) {
    db.collection('progress').doc(currentUser.uid).set({ state, updatedAt: Date.now() }, { merge: true })
      .catch(err => console.error('Sync error:', err));
  }
}

function taskId(wi, bi, ii){ return `w${wi}-b${bi}-i${ii}`; }

function weekProgress(wi){
  const week = DATA.weeks[wi];
  let total=0, done=0;
  week.blocks.forEach((b,bi)=>{
    b.items.forEach((_,ii)=>{
      total++;
      if(state[taskId(wi,bi,ii)]) done++;
    });
  });
  return {done, total};
}

function renderNav(activeIdx){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const labels = ["Overview", ...DATA.weeks.map(w=>w.title), "Resources"];
  labels.forEach((label, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = label;
    if(idx === activeIdx) btn.classList.add('active');
    btn.onclick = ()=> render(idx);
    nav.appendChild(btn);
  });
}

function render(activeIdx){
  activeTab = activeIdx;
  renderNav(activeIdx);
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(!fbEnabled){
    const banner = document.createElement('div');
    banner.className = 'setup-banner';
    banner.innerHTML = "Cross-device sync isn't configured yet — this device is running on local storage only. Add your Firebase config to enable sync.";
    main.appendChild(banner);
  }

  if(activeIdx === 0){
    const grid = document.createElement('div');
    grid.className = 'overview-grid';
    DATA.weeks.forEach((w, wi)=>{
      const {done,total} = weekProgress(wi);
      const pct = total ? Math.round(done/total*100) : 0;
      const card = document.createElement('div');
      card.className = 'overview-card';
      card.innerHTML = `<h3>${w.title} — ${w.theme}</h3>
        <div>${done}/${total} tasks complete</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      card.style.cursor = 'pointer';
      card.onclick = ()=> render(wi+1);
      grid.appendChild(card);
    });
    main.appendChild(grid);
    const resetWrap = document.createElement('div');
    resetWrap.innerHTML = `<button class="reset-btn" id="resetBtn">Reset all progress</button>`;
    main.appendChild(resetWrap);
    document.getElementById('resetBtn').onclick = ()=>{
      if(confirm('Reset all progress?')){
        state = {};
        localStorage.removeItem(STORAGE_KEY);
        saveRemote();
        render(0);
      }
    };
    return;
  }

  if(activeIdx === DATA.weeks.length + 1){
    const div = document.createElement('div');
    div.className = 'resources';
    div.innerHTML = '<h2 style="color:var(--accent)">Resources</h2><ul>' +
      DATA.resources.map(([name,url,desc])=>
        `<li><a href="${url}" target="_blank" style="color:var(--accent)">${name}</a> — ${desc}</li>`
      ).join('') + '</ul>';
    main.appendChild(div);
    return;
  }

  const wi = activeIdx - 1;
  const week = DATA.weeks[wi];
  const {done,total} = weekProgress(wi);
  const pct = total ? Math.round(done/total*100) : 0;

  const headerDiv = document.createElement('div');
  headerDiv.className = 'week-header';
  headerDiv.innerHTML = `<h2>${week.title}</h2><div class="theme">${week.theme}</div>`;
  main.appendChild(headerDiv);

  const progDiv = document.createElement('div');
  progDiv.className = 'week-progress';
  progDiv.innerHTML = `${done}/${total} tasks complete <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  main.appendChild(progDiv);

  week.blocks.forEach((block, bi)=>{
    const section = document.createElement('section');
    section.className = 'block';
    const h3 = document.createElement('h3');
    h3.innerHTML = `${block.h} <span class="badge">${block.badge}</span>`;
    section.appendChild(h3);
    const ul = document.createElement('ul');
    ul.className = 'tasklist';
    block.items.forEach((item, ii)=>{
      const id = taskId(wi,bi,ii);
      const li = document.createElement('li');
      if(state[id]) li.classList.add('checked');
      li.innerHTML = `<input type="checkbox" id="${id}" ${state[id]?'checked':''}><label for="${id}">${item}</label>`;
      const checkbox = li.querySelector('input');
      checkbox.addEventListener('change', ()=>{
        state[id] = checkbox.checked;
        saveLocal();
        saveRemote();
        li.classList.toggle('checked', checkbox.checked);
        const {done:d2,total:t2} = weekProgress(wi);
        progDiv.firstChild.textContent = `${d2}/${t2} tasks complete `;
        progDiv.querySelector('.progress-fill').style.width = (t2? Math.round(d2/t2*100):0)+'%';
      });
      ul.appendChild(li);
    });
    section.appendChild(ul);
    main.appendChild(section);
  });
}

render(0);

/* ---------------- Auth wiring ---------------- */
const authStatus = document.getElementById('authStatus');
const signInBtn = document.getElementById('signInBtn');
const signOutBtn = document.getElementById('signOutBtn');

if (!fbEnabled) {
  authStatus.textContent = "Sync not configured — progress saved on this device only";
} else {
  signInBtn.style.display = 'inline-block';

  signInBtn.onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithRedirect(provider);
  };
  signOutBtn.onclick = () => auth.signOut();

  auth.getRedirectResult().catch(err => console.error('Sign-in error:', err));

  auth.onAuthStateChanged(user => {
    currentUser = user;
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }

    if (user) {
      authStatus.textContent = `Signed in as ${user.displayName || user.email} — synced across devices`;
      signInBtn.style.display = 'none';
      signOutBtn.style.display = 'inline-block';

      const docRef = db.collection('progress').doc(user.uid);
      unsubscribeSnapshot = docRef.onSnapshot(snap => {
        if (snap.exists && snap.data().state) {
          state = snap.data().state;
          saveLocal();
          render(activeTab);
        } else {
          // first sign-in on this account: push whatever local progress we have
          docRef.set({ state, updatedAt: Date.now() }, { merge: true });
        }
      }, err => console.error('Listen error:', err));
    } else {
      authStatus.textContent = "Not signed in — progress saved on this device only";
      signInBtn.style.display = 'inline-block';
      signOutBtn.style.display = 'none';
    }
  });
}
</script>
</body>
</html>
