<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme de français sur 5 semaines — Post-202</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Français">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#1f2430; --sub:#5b6270;
    --accent:#1e3a5f; --accent2:#b23a2e; --line:#e4ddd0; --good:#2f7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia, 'Times New Roman', serif; background:var(--bg); color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--accent); color:#fff; padding:24px 32px 16px;
  }
  header h1{margin:0 0 4px; font-size:1.5rem; font-weight:600;}
  header p{margin:0; color:#cdd8e6; font-family:Helvetica,Arial,sans-serif; font-size:.9rem;}
  .authbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:10px 32px; background:#16283f; font-family:Helvetica,Arial,sans-serif; font-size:.85rem; color:#cdd8e6;
  }
  .authbar button{
    background:#fff; color:var(--accent); border:none; padding:7px 14px; border-radius:16px;
    font-size:.82rem; cursor:pointer; font-weight:600;
  }
  .authbar button.secondary{background:transparent; color:#cdd8e6; border:1px solid #3c526e;}
  nav{
    display:flex; flex-wrap:wrap; gap:6px; padding:14px 32px; background:#fff;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; font-family:Helvetica,Arial,sans-serif;
  }
  nav button.tab{
    border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 16px;
    border-radius:20px; cursor:pointer; font-size:.85rem; transition:.15s;
  }
  nav button.tab:hover{background:#f1ede4;}
  nav button.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  main{max-width:880px; margin:0 auto; padding:28px 32px 80px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .overview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; font-family:Helvetica,Arial,sans-serif;}
  @media (max-width:600px){ .overview-grid{grid-template-columns:1fr;} header,.authbar,nav,main{padding-left:16px; padding-right:16px;} }
  .overview-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .overview-card h3{margin:0 0 6px; font-size:.95rem; color:var(--accent);}
  .progress-bar{height:8px; border-radius:5px; overflow:hidden; background:#efe9dd; margin-top:8px;}
  .progress-fill{height:100%; background:var(--good); width:0%; transition:width .3s;}
  .week-header{margin-bottom:6px;}
  .week-header h2{margin:0; font-size:1.4rem; color:var(--accent);}
  .week-header .theme{font-family:Helvetica,Arial,sans-serif; color:var(--sub); font-size:.95rem; margin-top:2px;}
  .week-progress{font-family:Helvetica,Arial,sans-serif; font-size:.82rem; color:var(--sub); margin:10px 0 20px;}
  section.block{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 20px; margin-bottom:14px;
  }
  section.block h3{
    margin:0 0 10px; font-size:1.02rem; color:var(--accent2); font-family:Helvetica,Arial,sans-serif;
    display:flex; align-items:center; gap:8px;
  }
  section.block .badge{
    font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; background:#f1ede4;
    color:var(--sub); padding:2px 8px; border-radius:10px; font-weight:600;
  }
  ul.tasklist{list-style:none; margin:0; padding:0;}
  ul.tasklist li{
    display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:.94rem; line-height:1.45;
    font-family:Helvetica,Arial,sans-serif;
  }
  ul.tasklist li input{margin-top:3px; width:16px; height:16px; flex-shrink:0; cursor:pointer;}
  ul.tasklist li.checked label{color:var(--sub); text-decoration:line-through;}
  ul.tasklist a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent);}
  ul.tasklist a:hover{color:var(--accent2);}
  .resources ul{padding-left:18px;}
  .resources li{margin-bottom:6px; font-family:Helvetica,Arial,sans-serif; font-size:.92rem;}
  .reset-btn{
    font-family:Helvetica,Arial,sans-serif; font-size:.8rem; background:none; border:1px solid var(--line);
    color:var(--sub); padding:5px 12px; border-radius:14px; cursor:pointer; margin-top:24px;
  }
  .reset-btn:hover{border-color:var(--accent2); color:var(--accent2);}
  .setup-banner{
    font-family:Helvetica,Arial,sans-serif; font-size:.85rem; background:#fff3e0; border:1px solid #f0c98a;
    color:#7a5210; padding:12px 16px; border-radius:8px; margin-bottom:18px;
  }
</style>
</head>
<body>

<header>
  <h1>Programme de français — Après En Avant 202</h1>
  <p>5 semaines · ~8 h/semaine · Grammaire · InnerFrench · Nouvelle Vague · Littérature et poésie</p>
</header>

<div class="authbar">
  <span id="authStatus">Vérification de la connexion…</span>
  <span>
    <button id="signInBtn" style="display:none;">Se connecter avec Google</button>
    <button id="signOutBtn" class="secondary" style="display:none;">Se déconnecter</button>
  </span>
</div>

<nav id="nav"></nav>
<main id="main"></main>

<!-- Firebase (compat SDK, loaded from CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================================
   FIREBASE CONFIG — replace with your own project's values.
   Get these from: Firebase Console > Project settings > General >
   "Your apps" > Web app > SDK setup and configuration > Config.
   These values are safe to keep in client-side code — access is controlled
   by Firestore security rules, not by hiding this object.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

let fbEnabled = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db, auth, currentUser = null, unsubscribeSnapshot = null;

if (fbEnabled) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>

  resources: [

    ["InnerFrench", "https://innerfrench.com", "Podcast niveau intermédiaire — pilier d'écoute hebdomadaire"],
    ["News in Slow French", "https://www.newsinslowfrench.com", "Actualités audio ralenties"],
    ["RFI — Journal en français facile", "https://francaisfacile.rfi.fr", "Actualités quotidiennes simplifiées"],
    ["TV5MONDE Langue Française", "https://langue-francaise.tv5monde.com", "Culture francophone et vidéos"],

  ]
};

const STORAGE_KEY = "frenchProgramProgress";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let activeTab = 0;

function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function saveRemote(){
  if (fbEnabled && currentUser && db) {
    db.collection('progress').doc(currentUser.uid).set({ state, updatedAt: Date.now() }, { merge: true })
      .catch(err => console.error('Sync error:', err));
  }
}

function taskId(wi, bi, ii){ return `w${wi}-b${bi}-i${ii}`; }

function weekProgress(wi){
  const week = DATA.weeks[wi];
  let total=0, done=0;
  week.blocks.forEach((b,bi)=>{
    b.items.forEach((_,ii)=>{
      total++;
      if(state[taskId(wi,bi,ii)]) done++;
    });
  });
  return {done, total};
}

function renderNav(activeIdx){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const labels = ["Aperçu", ...DATA.weeks.map(w=>w.title), "Ressources"];
  labels.forEach((label, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = label;
    if(idx === activeIdx) btn.classList.add('active');
    btn.onclick = ()=> render(idx);
    nav.appendChild(btn);
  });
}

function render(activeIdx){
  activeTab = activeIdx;
  renderNav(activeIdx);
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(!fbEnabled){
    const banner = document.createElement('div');
    banner.className = 'setup-banner';
    banner.innerHTML = "La synchronisation entre appareils n'est pas encore configurée — cet appareil fonctionne uniquement avec le stockage local. Ajoutez votre configuration Firebase pour activer la synchronisation.";
    main.appendChild(banner);
  }

  if(activeIdx === 0){
    const grid = document.createElement('div');
    grid.className = 'overview-grid';
    DATA.weeks.forEach((w, wi)=>{
      const {done,total} = weekProgress(wi);
      const pct = total ? Math.round(done/total*100) : 0;
      const card = document.createElement('div');
      card.className = 'overview-card';
      card.innerHTML = `<h3>${w.title} — ${w.theme}</h3>
        <div>${done}/${total} tâches terminées</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      card.style.cursor = 'pointer';
      card.onclick = ()=> render(wi+1);
      grid.appendChild(card);
    });
    main.appendChild(grid);
    const resetWrap = document.createElement('div');
    resetWrap.innerHTML = `<button class="reset-btn" id="resetBtn">Réinitialiser la progression</button>`;
    main.appendChild(resetWrap);
    document.getElementById('resetBtn').onclick = ()=>{
      if(confirm('Réinitialiser toute la progression ?')){
        state = {};
        localStorage.removeItem(STORAGE_KEY);
        saveRemote();
        render(0);
      }
    };
    return;
  }

  if(activeIdx === DATA.weeks.length + 1){
    const div = document.createElement('div');
    div.className = 'resources';
    div.innerHTML = '<h2 style="color:var(--accent)">Ressources</h2><ul>' +
      DATA.resources.map(([name,url,desc])=>
        `<li><a href="${url}" target="_blank" style="color:var(--accent)">${name}</a> — ${desc}</li>`
      ).join('') + '</ul>';
    main.appendChild(div);
    return;
  }

  const wi = activeIdx - 1;
  const week = DATA.weeks[wi];
  const {done,total} = weekProgress(wi);
  const pct = total ? Math.round(done/total*100) : 0;

  const headerDiv = document.createElement('div');
  headerDiv.className = 'week-header';
  headerDiv.innerHTML = `<h2>${week.title}</h2><div class="theme">${week.theme}</div>`;
  main.appendChild(headerDiv);

  const progDiv = document.createElement('div');
  progDiv.className = 'week-progress';
  progDiv.innerHTML = `${done}/${total} tâches terminées <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  main.appendChild(progDiv);

  week.blocks.forEach((block, bi)=>{
    const section = document.createElement('section');
    section.className = 'block';
    const h3 = document.createElement('h3');
    h3.innerHTML = `${block.h} <span class="badge">${block.badge}</span>`;
    section.appendChild(h3);
    const ul = document.createElement('ul');
    ul.className = 'tasklist';
    block.items.forEach((item, ii)=>{
      const id = taskId(wi,bi,ii);
      const li = document.createElement('li');
      if(state[id]) li.classList.add('checked');
      li.innerHTML = `<input type="checkbox" id="${id}" ${state[id]?'checked':''}><label for="${id}">${item}</label>`;
      const checkbox = li.querySelector('input');
      checkbox.addEventListener('change', ()=>{
        state[id] = checkbox.checked;
        saveLocal();
        saveRemote();
        li.classList.toggle('checked', checkbox.checked);
        const {done:d2,total:t2} = weekProgress(wi);
        progDiv.firstChild.textContent = `${d2}/${t2} tâches terminées `;
        progDiv.querySelector('.progress-fill').style.width = (t2? Math.round(d2/t2*100):0)+'%';
      });
      ul.appendChild(li);
    });
    section.appendChild(ul);
    main.appendChild(section);
  });
}

render(0);

/* ---------------- Auth wiring ---------------- */
const authStatus = document.getElementById('authStatus');
const signInBtn = document.getElementById('signInBtn');
const signOutBtn = document.getElementById('signOutBtn');

if (!fbEnabled) {
  authStatus.textContent = "Synchronisation non configurée — progression enregistrée uniquement sur cet appareil";
} else {
  signInBtn.style.display = 'inline-block';

  signInBtn.onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithRedirect(provider);
  };
  signOutBtn.onclick = () => auth.signOut();

  auth.getRedirectResult().catch(err => console.error('Sign-in error:', err));

  auth.onAuthStateChanged(user => {
    currentUser = user;
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }

    if (user) {
      authStatus.textContent = `Connecté en tant que ${user.displayName || user.email} — synchronisé entre appareils`;
      signInBtn.style.display = 'none';
      signOutBtn.style.display = 'inline-block';

      const docRef = db.collection('progress').doc(user.uid);
      unsubscribeSnapshot = docRef.onSnapshot(snap => {
        if (snap.exists && snap.data().state) {
          state = snap.data().state;
          saveLocal();
          render(activeTab);
        } else {
          // first sign-in on this account: push whatever local progress we have
          docRef.set({ state, updatedAt: Date.now() }, { merge: true });
        }
      }, err => console.error('Listen error:', err));
    } else {
      authStatus.textContent = "Non connecté — progression enregistrée uniquement sur cet appareil";
      signInBtn.style.display = 'inline-block';
      signOutBtn.style.display = 'none';
    }
  });
}
</script>
</body>
</html>
